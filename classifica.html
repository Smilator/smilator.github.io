<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Classifica · Frankenstein</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap');
  :root {
    color-scheme: light;
    --bg: #f4f4f6; --bg-elev: #ffffff; --bg-elev-2: #eef0f2;
    --border: #e2e2e6; --text: #14161a; --text-dim: #6b7280;
    --accent: #e4002b; --accent-tint: #fdecef;
    --radius: 16px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(20,22,26,.06), 0 1px 3px rgba(20,22,26,.05);
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
  a { color: inherit; }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--bg-elev);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .hwrap { max-width: 720px; margin: 0 auto; padding: 14px 18px 12px; display: flex; align-items: center; gap: 10px; }
  .brandmark { width: 24px; height: 23px; flex: none; display: block; }
  .wordmark { font: 700 20px/1 var(--display); letter-spacing: -.01em; flex: none; }
  h1 { font: 700 15px var(--display); margin: 0; color: var(--text-dim); }
  .back { margin-left: auto; font-size: 12px; font-weight: 600; text-decoration: none; color: var(--text-dim); }
  main { max-width: 720px; margin: 0 auto; padding: 18px; }
  .intro { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }
  .row {
    display: flex; align-items: center; gap: 12px; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
  }
  .rank { font: 700 15px var(--display); color: var(--text-dim); width: 24px; text-align: center; flex: none; }
  .row:nth-child(-n+3) .rank { color: var(--accent); }
  .cover {
    width: 40px; height: 54px; border-radius: 6px; object-fit: cover; flex: none; background: var(--bg-elev-2);
  }
  .mono {
    width: 40px; height: 54px; border-radius: 6px; flex: none; background: var(--bg-elev-2);
    display: flex; align-items: center; justify-content: center; font: 700 18px var(--display); color: #c2c6cd;
  }
  .info { flex: 1 1 auto; min-width: 0; }
  .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .votecount {
    flex: none; text-align: center; background: var(--accent-tint); color: var(--accent);
    border-radius: 999px; padding: 4px 10px; font: 700 13px var(--sans); font-variant-numeric: tabular-nums;
  }
  .empty { color: var(--text-dim); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <img class="brandmark" src="favicon.svg" alt="" width="24" height="23">
    <span class="wordmark">Frankenstein</span>
    <h1>Classifica salvataggi</h1>
    <a class="back" href="index.html">← Torna al sito</a>
  </div>
</header>
<main>
  <p class="intro">I giochi trashati più votati da chi vuole vederli riportati in vita. Vota dalla scheda "Trashed" di un gioco sul sito principale.</p>
  <div id="list"></div>
</main>
<script src="classifica.js?v=dcd55977f7fc"></script>
<script>
  var CLASSIFICA = window.CLASSIFICA || [];
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var list = document.getElementById('list');
  if (!CLASSIFICA.length) {
    list.innerHTML = '<div class="empty">Nessun voto ancora — sii il primo a salvare un gioco dal Trash!</div>';
  } else {
    list.innerHTML = CLASSIFICA.map(function (g, i) {
      var mono = esc((g.name || '?').charAt(0).toUpperCase());
      var cov = g.ig ? 'https://images.igdb.com/igdb/image/upload/' + esc(g.ig) + '.jpg' : '';
      var art = cov
        ? '<img class="cover" loading="lazy" alt="" src="' + cov + '">'
        : '<div class="mono">' + mono + '</div>';
      var sub = [esc(g.platformLabel || g.platform), g.year ? esc(String(g.year)) : ''].filter(Boolean).join(' · ');
      return '<div class="row"><div class="rank">' + (i + 1) + '</div>' + art +
        '<div class="info"><div class="name">' + esc(g.name) + '</div><div class="sub">' + sub + '</div></div>' +
        '<div class="votecount">👍 ' + g.v + '</div></div>';
    }).join('');
  }
</script>
</body>
</html>
