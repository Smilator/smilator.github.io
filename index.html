<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Frankenstein</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root {
    color-scheme: light;
    --bg: #f4f4f6; --bg-elev: #ffffff; --bg-elev-2: #eef0f2;
    --border: #e2e2e6; --text: #14161a; --text-dim: #6b7280;
    --accent: #e4002b; --accent-tint: #fdecef;
    --good: #16a34a; --good-tint: #e7f6ec; --warn: #b45309; --warn-tint: #fdf0e3;
    --radius: 16px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(20,22,26,.06), 0 1px 3px rgba(20,22,26,.05);
    --shadow-md: 0 8px 30px rgba(20,22,26,.14);
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
  a { color: inherit; }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--bg-elev);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .hwrap { max-width: 1100px; margin: 0 auto; padding: 14px 18px 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .wordmark { font: 700 22px/1 var(--display); letter-spacing: -.01em; }
  .wordmark b { color: var(--accent); }
  .stamp { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .counts { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .seg { display: flex; width: 100%; margin-top: 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-elev-2); }
  .seg button {
    flex: 1 1 0; background: transparent; color: var(--text-dim); border: 0;
    padding: 9px 6px; font: 600 13px var(--sans); cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  #colbar { margin-top: 4px; }
  .filters { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .filters label {
    display: flex; align-items: center; gap: 6px;
    font: 600 13px var(--sans); color: var(--text-dim); cursor: pointer;
  }
  .filters input { accent-color: var(--accent); width: 16px; height: 16px; }
  .filters .platrow { margin-top: 0; margin-left: auto; }
  .filters .platrow .title { font: 700 15px var(--sans); letter-spacing: 0; }
  .searchbar { margin-top: 12px; }
  .searchbar input {
    width: 100%; background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; font-size: 15px;
  }
  .searchbar input:focus { outline: 2px solid var(--accent-tint); border-color: var(--accent); }
  .platrow {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit;
  }
  .platrow .title { font: 700 26px/1.1 var(--display); letter-spacing: -.02em; text-align: left; }
  .platrow .chev { color: var(--text-dim); transition: transform .15s; font-size: 18px; }
  .platrow[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .picker {
    position: absolute; left: 0; right: 0; z-index: 30; background: var(--bg-elev);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-md);
    max-height: 70vh; overflow: auto;
  }
  .picker .inner { max-width: 1100px; margin: 0 auto; padding: 6px; }
  .picker button {
    display: flex; width: 100%; justify-content: space-between; align-items: center;
    background: none; border: 0; color: var(--text); font: 500 15px var(--sans);
    padding: 12px 14px; cursor: pointer; border-radius: var(--radius-sm);
  }
  .picker button:hover, .picker button.here { background: var(--accent-tint); }
  .picker button .n { color: var(--text-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 18px 40px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
  .card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .cover { aspect-ratio: 3/4; width: 100%; background: var(--bg-elev-2); display: block; object-fit: cover; }
  .mono {
    aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center;
    font: 700 40px var(--display); color: #c2c6cd; background: var(--bg-elev-2);
  }
  .meta { padding: 10px 11px 12px; }
  .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .sub { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  .merged-rows { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .merged-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .merged-row .pl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    flex: none; font-size: 10px; font-weight: 700; padding: 1px 7px;
    border-radius: 999px; letter-spacing: .02em;
  }
  .pill.owned { background: var(--good-tint); color: var(--good); }
  .pill.wishlist { background: var(--warn-tint); color: var(--warn); }
  .pill.trash { background: var(--accent-tint); color: var(--accent); }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 20px; }

  /* stats panel */
  #stats { max-width: 1100px; margin: 16px auto 0; padding: 0 18px; }
  .stats-card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px 18px;
  }
  .kpis { display: flex; gap: 24px; flex-wrap: wrap; }
  .kpi { display: flex; flex-direction: column; gap: 2px; }
  .kpi .v { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .kpi.owned .v { color: var(--good); }
  .kpi.wishlist .v { color: var(--warn); }
  .kpi.unjudged .v { color: var(--text-dim); }
  .kpi.trash .v { color: var(--accent); }
  .propbar {
    display: flex; height: 8px; border-radius: 999px; overflow: hidden;
    margin-top: 14px; background: var(--bg-elev-2);
  }
  .propbar i { display: block; }
  .propbar .owned { background: var(--good); }
  .propbar .wishlist { background: var(--warn); }
  .propbar .unjudged { background: #c2c6cd; }
  .propbar .trash { background: var(--accent); }
  .byconsole { margin-top: 14px; }
  .byconsole > summary {
    cursor: pointer; font: 600 12px var(--sans); color: var(--text-dim); list-style: none;
  }
  .byconsole > summary::-webkit-details-marker { display: none; }
  .crow {
    display: grid; grid-template-columns: 132px 1fr auto; align-items: center;
    gap: 10px; margin-top: 8px; font-size: 12px;
  }
  .crow .pl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .cbar { height: 8px; border-radius: 999px; background: var(--accent-tint); overflow: hidden; }
  .crow .cbar i { display: block; height: 100%; background: var(--accent); }
  .crow .cn { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .ccount { margin-top: 8px; font-size: 11px; color: var(--text-dim); }

  /* feed */
  .day-section { margin-top: 28px; }
  .day-section h2 { font: 700 15px var(--display); margin: 0 0 12px; letter-spacing: -.01em; }
  .trash-acc {
    margin-top: 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg-elev); overflow: hidden;
  }
  .trash-acc > summary {
    cursor: pointer; padding: 10px 14px; font: 600 13px var(--sans);
    color: var(--accent); list-style: none;
  }
  .trash-acc > summary::-webkit-details-marker { display: none; }
  .trash-acc .grid { padding: 14px; }
  details.earlier { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 6px; }
  details.earlier > summary {
    cursor: pointer; font: 700 15px var(--display); padding: 10px 0; list-style: none;
  }
  details.earlier > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <span class="wordmark">Franken<b>stein</b></span>
      <span class="stamp">Updated 29 Aug 2026</span>
    </div>
    <div class="seg" id="view">
      <button data-v="activity" class="active">Activity</button>
      <button data-v="collection">Collection</button>
    </div>
    <div id="colbar" style="display:none">
      <div class="counts" id="counts"></div>
      <div class="searchbar">
        <input id="q" type="search" placeholder="Search every Frankie game…" autocomplete="off">
      </div>
      <div class="filters">
        <label><input type="checkbox" id="fOwned" checked> Owned</label>
        <label><input type="checkbox" id="fWish" checked> Wishlist</label>
        <button class="platrow" id="platBtn" aria-expanded="false">
          <span class="title" id="platTitle">All Frankie Games</span>
          <span class="chev">⌄</span>
        </button>
      </div>
    </div>
  </div>
  <div class="picker" id="picker" style="display:none"><div class="inner" id="pickerInner"></div></div>
</header>
<section id="stats" style="display:none"></section>
<main><div id="feed"></div></main>
<script src="data.js"></script>
<script>
  var GAMES = window.GAMES || [], PLATFORMS = window.PLATFORMS || [];
  var STATS = window.STATS || { owned: 0, wishlist: 0, unjudged: 0, trash: 0, byConsole: [] };
  // Trash is huge (100k+) — its own file, fetched only on the first search or
  // when the day-feed needs its per-day "trashed" accordions.
  var TRASH = [], trashState = 'none';  // none | loading | ready
  function loadTrash() {
    if (trashState === 'loading' || trashState === 'ready') return;
    trashState = 'loading';
    var sc = document.createElement('script');
    sc.src = 'trash.js';
    sc.onload = function () {
      TRASH = window.TRASH || [];
      // trash rows carry the merge key as `ig_id` to keep bytes down elsewhere.
      TRASH.forEach(function (t) { if (t.ig_id != null && t.igdb_id == null) t.igdb_id = t.ig_id; });
      trashState = 'ready';
      render();
    };
    sc.onerror = function () { trashState = 'none'; };
    document.head.appendChild(sc);
    render();  // show a "loading…" state immediately
  }
  var labelBySlug = {};
  PLATFORMS.forEach(function (p) { labelBySlug[p.slug] = p.label; });
  (STATS.byConsole || []).forEach(function (c) { if (!labelBySlug[c.slug]) labelBySlug[c.slug] = c.label; });

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  document.getElementById('counts').textContent =
    fmt(STATS.owned || 0) + ' owned · ' + fmt(STATS.wishlist || 0) + ' wishlisted';

  var state = { view: 'activity', q: '', platform: '', owned: true, wishlist: true };
  var MAX = 600;
  var IGDB_IMG = 'https://images.igdb.com/igdb/image/upload/';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  window.thumbFail = function (img) {
    var d = document.createElement('div');
    d.className = 'mono';
    d.textContent = img.getAttribute('data-mono') || '?';
    img.replaceWith(d);
  };
  function coverUrl(g) { return g.cover || (g.ig ? IGDB_IMG + g.ig + '.jpg' : null); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Search relevance: exact name (0) < starts-with (1) < a word starts with it
  // (2) < appears anywhere (3); -1 = no match. Lower sorts first.
  function scoreName(name, q) {
    var n = (name || '').toLowerCase();
    if (n === q) return 0;
    if (n.lastIndexOf(q, 0) === 0) return 1;
    var words = n.split(/[^a-z0-9]+/);
    for (var i = 0; i < words.length; i++) if (words[i].lastIndexOf(q, 0) === 0) return 2;
    return n.indexOf(q) !== -1 ? 3 : -1;
  }
  function bySearch(list, q) {
    return list
      .map(function (g) { return { g: g, s: scoreName(g.name, q) }; })
      .filter(function (x) { return x.s !== -1; })
      .sort(function (a, b) {
        return a.s - b.s || (a.g.name || '').localeCompare(b.g.name || '');
      })
      .map(function (x) { return x.g; });
  }

  // ---- cross-platform merge (mirrors the desktop wishlist view) ----------
  // One card per game (keyed by igdb_id); each console it's on = one row with an
  // owned / wishlist / trash pill. Read-only — no status controls.
  function groupByGame(list) {
    var map = {}, order = [];
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      var key = g.igdb_id != null ? 'i' + g.igdb_id : 'm' + g.id;
      var grp = map[key];
      if (!grp) { grp = { rep: g, bySlug: {}, rows: [], d: null }; map[key] = grp; order.push(key); }
      if (g.d && (!grp.d || g.d > grp.d)) grp.d = g.d;
      if (!grp.bySlug[g.platform]) {
        var row = { slug: g.platform, label: labelBySlug[g.platform] || g.platform, status: g.status || 'trash' };
        grp.bySlug[g.platform] = row;
        grp.rows.push(row);
      }
    }
    return order.map(function (k) {
      var grp = map[k];
      grp.rows.sort(function (a, b) { return a.label.localeCompare(b.label); });
      return grp;
    });
  }

  function mergedCard(grp) {
    var g = grp.rep;
    var mono = esc((g.name || '?').charAt(0).toUpperCase());
    var cov = coverUrl(g);
    var art = cov
      ? '<img class="cover" loading="lazy" alt="" data-mono="' + mono +
        '" src="' + esc(cov) + '" onerror="thumbFail(this)">'
      : '<div class="mono">' + mono + '</div>';
    var multi = grp.rows.length > 1;
    var sub = multi
      ? (g.year ? g.year + ' · ' : '') + grp.rows.length + ' consoles'
      : [labelBySlug[g.platform] || g.platform, g.year].filter(Boolean).join(' · ');
    var rows = grp.rows.map(function (r) {
      return '<div class="merged-row"><span class="pl">' + esc(r.label) +
        '</span><span class="pill ' + r.status + '">' + cap(r.status) + '</span></div>';
    }).join('');
    return '<div class="card">' + art +
      '<div class="meta"><div class="name">' + esc(g.name) + '</div>' +
      '<div class="sub">' + esc(sub) + '</div>' +
      '<div class="merged-rows">' + rows + '</div></div></div>';
  }

  function byPlatform(list) {
    return state.platform ? list.filter(function (g) { return g.platform === state.platform; }) : list;
  }
  function statusSet() {
    var s = {};
    if (state.owned) s.owned = 1;
    if (state.wishlist) s.wishlist = 1;
    return s;
  }
  function gridHtml(groups) {
    if (!groups.length) return '<div class="empty">Nothing here.</div>';
    var capped = groups.length > MAX;
    return '<div class="grid">' + groups.slice(0, MAX).map(mergedCard).join('') + '</div>' +
      (capped ? '<div class="empty">Showing first ' + MAX + ' — narrow it with search or a console.</div>' : '');
  }
  function fmtDay(day) {
    var dt = new Date(day + 'T00:00');
    if (isNaN(dt)) return day;
    return dt.toLocaleDateString('en-GB', { weekday: 'long' }) + ', ' +
      dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
  }

  // ---- stats panel (mirrors the desktop "All consoles" LibrarySnapshot) --
  function renderStats() {
    var el = document.getElementById('stats');
    var bc = STATS.byConsole || [];
    var o, w, u, t;
    if (state.platform) {
      var c = bc.filter(function (x) { return x.slug === state.platform; })[0] || { owned: 0, wishlist: 0, trash: 0 };
      o = c.owned; w = c.wishlist; t = c.trash; u = null;
    } else {
      o = STATS.owned || 0; w = STATS.wishlist || 0; u = STATS.unjudged || 0; t = STATS.trash || 0;
    }
    var grand = (o + w + (u || 0) + t) || 1;
    function kpi(cls, val, lab) {
      return val == null ? '' :
        '<div class="kpi ' + cls + '"><span class="v">' + fmt(val) +
        '</span><span class="l">' + lab + '</span></div>';
    }
    function seg(cls, val) {
      return val ? '<i class="' + cls + '" style="width:' + (val / grand * 100).toFixed(2) + '%"></i>' : '';
    }
    var open = false;
    try { open = localStorage.getItem('pub:stats-open') === '1'; } catch (e) {}
    var kept = bc.filter(function (x) { return (x.owned + x.wishlist) > 0; });
    var maxKept = kept.reduce(function (m, x) { return Math.max(m, x.owned + x.wishlist); }, 1);
    var rows = kept.slice(0, 8).map(function (x) {
      var k = x.owned + x.wishlist;
      return '<div class="crow"><span class="pl">' + esc(x.label) +
        '</span><span class="cbar"><i style="width:' + (k / maxKept * 100).toFixed(1) + '%"></i></span>' +
        '<span class="cn">' + fmt(k) + '</span></div>';
    }).join('');
    var more = kept.length > 8 ? '<div class="ccount">+' + (kept.length - 8) + ' more consoles</div>' : '';
    el.innerHTML = '<div class="stats-card"><div class="kpis">' +
      kpi('owned', o, 'Owned') + kpi('wishlist', w, 'Wishlist') +
      kpi('unjudged', u, 'Unjudged') + kpi('trash', t, 'Trash') +
      '</div><div class="propbar">' + seg('owned', o) + seg('wishlist', w) +
      seg('unjudged', u || 0) + seg('trash', t) + '</div>' +
      (kept.length && !state.platform
        ? '<details class="byconsole"' + (open ? ' open' : '') +
          '><summary>by console</summary>' + rows + more + '</details>'
        : '') +
      '</div>';
    var d = el.querySelector('.byconsole');
    if (d) d.addEventListener('toggle', function () {
      try { localStorage.setItem('pub:stats-open', d.open ? '1' : '0'); } catch (e) {}
    });
  }

  function render() {
    var activity = state.view === 'activity';
    document.getElementById('colbar').style.display = activity ? 'none' : '';
    document.getElementById('stats').style.display = activity ? 'none' : '';
    [].forEach.call(document.getElementById('view').children, function (b) {
      b.classList.toggle('active', b.dataset.v === state.view);
    });
    if (activity) renderActivity();
    else renderCollection();
  }

  // ---- COLLECTION: search + stats + owned/wishlist + platform ------------
  function renderCollection() {
    renderStats();
    var feed = document.getElementById('feed');
    var q = state.q.trim().toLowerCase();
    var set = statusSet();  // at least one of owned/wishlist is always on
    if (q.length === 1) { feed.innerHTML = '<div class="empty">Keep typing…</div>'; return; }

    // search — owned/wishlist matches first, trashed in an accordion after
    if (q.length >= 2) {
      if (trashState !== 'ready') {
        if (trashState === 'none') loadTrash();
        feed.innerHTML = '<div class="empty">Loading…</div>';
        return;
      }
      var ow = bySearch(byPlatform(GAMES).filter(function (g) { return set[g.status]; }), q);
      var tr = bySearch(byPlatform(TRASH), q);
      var owG = groupByGame(ow), trG = groupByGame(tr);
      var html = owG.length ? gridHtml(owG) : '<div class="empty">No matches.</div>';
      if (trG.length) {
        html += '<details class="trash-acc" open><summary>Trashed (' + trG.length +
          ')</summary>' + gridHtml(trG) + '</details>';
      }
      feed.innerHTML = html;
      return;
    }

    // browse — flat A–Z grid of the selected statuses on the selected platform
    var list = byPlatform(GAMES).filter(function (g) { return set[g.status]; });
    var groups = groupByGame(list).sort(function (a, b) {
      return (a.rep.name || '').localeCompare(b.rep.name || '');
    });
    feed.innerHTML = gridHtml(groups);
  }

  // ---- ACTIVITY: the per-day feed --------------------------------------
  function renderActivity() {
    var feed = document.getElementById('feed');
    if (trashState !== 'ready') {
      if (trashState === 'none') loadTrash();
      feed.innerHTML = '<div class="empty">Loading feed…</div>';
      return;
    }
    var ownedG = groupByGame(GAMES);
    var trashG = groupByGame(TRASH.filter(function (g) { return g.d; }));
    var buckets = {}, earlier = { cards: [], trash: [] };
    ownedG.forEach(function (grp) {
      if (grp.d) (buckets[grp.d] = buckets[grp.d] || { cards: [], trash: [] }).cards.push(grp);
      else earlier.cards.push(grp);
    });
    trashG.forEach(function (grp) {
      if (grp.d) (buckets[grp.d] = buckets[grp.d] || { cards: [], trash: [] }).trash.push(grp);
      else earlier.trash.push(grp);
    });
    var days = Object.keys(buckets).sort().reverse();
    if (!days.length && !earlier.cards.length) {
      feed.innerHTML = '<div class="empty">Nothing yet.</div>';
      return;
    }
    var out = '';
    days.forEach(function (day) {
      var b = buckets[day];
      out += '<section class="day-section"><h2>' + esc(fmtDay(day)) + '</h2>';
      if (b.cards.length) out += gridHtml(b.cards);
      if (b.trash.length) {
        out += '<details class="trash-acc"><summary>Trashed (' + b.trash.length +
          ')</summary>' + gridHtml(b.trash) + '</details>';
      }
      out += '</section>';
    });
    if (earlier.cards.length || earlier.trash.length) {
      out += '<details class="earlier"><summary>Earlier</summary>';
      if (earlier.cards.length) out += gridHtml(earlier.cards);
      if (earlier.trash.length) {
        out += '<details class="trash-acc"><summary>Trashed (' + earlier.trash.length +
          ')</summary>' + gridHtml(earlier.trash) + '</details>';
      }
      out += '</details>';
    }
    feed.innerHTML = out;
  }

  // ---- platform picker (custom, not a <select>) --------------------------
  function platCounts() {
    var c = {};
    var src = (state.q && trashState === 'ready') ? GAMES.concat(TRASH) : GAMES;
    src.forEach(function (g) { c[g.platform] = (c[g.platform] || 0) + 1; });
    return c;
  }
  function buildPicker() {
    var c = platCounts();
    var slugs = PLATFORMS.map(function (p) { return p.slug; })
      .filter(function (s) { return c[s]; })
      .sort(function (a, b) { return (labelBySlug[a] || a).localeCompare(labelBySlug[b] || b); });
    var rows = ['<button data-slug="" class="' + (state.platform ? '' : 'here') +
      '">All Frankie Games <span class="n">' +
      Object.keys(c).reduce(function (t, k) { return t + c[k]; }, 0) + '</span></button>'];
    slugs.forEach(function (s) {
      rows.push('<button data-slug="' + esc(s) + '" class="' + (s === state.platform ? 'here' : '') +
        '">' + esc(labelBySlug[s] || s) + ' <span class="n">' + c[s] + '</span></button>');
    });
    document.getElementById('pickerInner').innerHTML = rows.join('');
  }
  function setPlatform(slug) {
    state.platform = slug;
    document.getElementById('platTitle').textContent =
      slug ? (labelBySlug[slug] || slug) : 'All Frankie Games';
    closePicker(); render();
  }
  function openPicker() {
    buildPicker();
    document.getElementById('picker').style.display = '';
    document.getElementById('platBtn').setAttribute('aria-expanded', 'true');
  }
  function closePicker() {
    document.getElementById('picker').style.display = 'none';
    document.getElementById('platBtn').setAttribute('aria-expanded', 'false');
  }
  document.getElementById('platBtn').addEventListener('click', function () {
    document.getElementById('picker').style.display === 'none' ? openPicker() : closePicker();
  });
  document.getElementById('pickerInner').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setPlatform(b.dataset.slug);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#picker') && !e.target.closest('#platBtn')) closePicker();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePicker(); });

  document.getElementById('view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.v;
    render();
  });
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  // one of owned / wishlist must stay checked
  function onCheck(id, other, key) {
    document.getElementById(id).addEventListener('change', function (e) {
      if (!e.target.checked && !document.getElementById(other).checked) {
        e.target.checked = true;  // revert — can't clear both
        return;
      }
      state[key] = e.target.checked;
      render();
    });
  }
  onCheck('fOwned', 'fWish', 'owned');
  onCheck('fWish', 'fOwned', 'wishlist');

  render();
</script>
</body>
</html>
