  // Lucide paths (same icon set as the app), inlined so the site stays static.

    down: '<path d="m6 9 6 6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    play: '<path d="M6 3l14 9-14 9z" fill="currentColor"/>',
    thumb: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3"/>',
    gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'
  };
  function icon(name, size) {
    var s = size || 14;
    return '<svg class="ic" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
      ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  // Status look, mirrors frontend/src/components/status.tsx.
  var STATUS = {
    owned: { icon: 'star', label: 'Owned' },
    wishlist: { icon: 'heart', label: 'Wishlist' },
    unjudged: { icon: 'dashed', label: 'Unjudged' },
    trash: { icon: 'x', label: 'Trashed' }
  };
  function themeIcon() {
    return icon(document.documentElement.getAttribute('data-theme') === 'light' ? 'moon' : 'sun', 16);
  }
  function toggleTheme(btn) {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    if (btn) btn.innerHTML = themeIcon();
  }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.16 0.01 275);
    --bg-sunk: oklch(0.13 0.01 275);
    --surface: oklch(0.2 0.012 275);
    --surface-2: oklch(0.24 0.012 275);
    --surface-3: oklch(0.3 0.012 275);
    --line: oklch(0.26 0.012 275);
    --line-strong: oklch(0.34 0.012 275);
    --scrim: rgb(6 6 12 / 0.62);
    --glass: rgb(10 10 16 / 0.72);
    --header-bg: rgb(22 22 30 / 0.78);
    --text: oklch(0.96 0.005 275);
    --text-2: oklch(0.76 0.01 275);
    --text-3: oklch(0.6 0.01 275);
    --accent: oklch(0.68 0.21 295);
    --accent-hover: oklch(0.73 0.2 295);
    --accent-soft: oklch(0.68 0.21 295 / 0.16);
    --accent-text: oklch(0.82 0.13 295);
    --on-accent: #fff;
    --st-owned: oklch(0.8 0.14 160);
    --st-wishlist: oklch(0.74 0.17 355);
    --st-unjudged: oklch(0.76 0.01 275);
    --st-trash: oklch(0.62 0.01 275);
    --st-review: oklch(0.84 0.15 85);
    --st-requested: oklch(0.78 0.12 250);
    --good: var(--st-owned);
    --warn: var(--st-review);
    --bad: oklch(0.7 0.19 25);
    --font-ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, Consolas, monospace;
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-xl: 14px; --r-pill: 999px;
    --sh-card: 0 2px 8px rgb(0 0 0 / 0.3);
    --sh-card-hover: 0 0 0 2px var(--accent), 0 14px 30px rgb(0 0 0 / 0.5);
    --sh-pop: 0 18px 50px rgb(0 0 0 / 0.5), 0 0 0 1px var(--line);
    --sh-glow: 0 6px 20px oklch(0.68 0.21 295 / 0.35);
    --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --dur: 180ms;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: oklch(0.975 0.003 275);
    --bg-sunk: oklch(0.95 0.005 275);
    --surface: #fff;
    --surface-2: oklch(0.955 0.005 275);
    --surface-3: oklch(0.91 0.007 275);
    --line: oklch(0.91 0.006 275);
    --line-strong: oklch(0.84 0.008 275);
    --scrim: rgb(20 20 30 / 0.45);
    --header-bg: rgb(249 249 252 / 0.82);
    --text: oklch(0.2 0.01 275);
    --text-2: oklch(0.44 0.01 275);
    --text-3: oklch(0.56 0.01 275);
    --accent: oklch(0.55 0.24 295);
    --accent-hover: oklch(0.5 0.24 295);
    --accent-soft: oklch(0.55 0.24 295 / 0.1);
    --accent-text: oklch(0.5 0.24 295);
    --st-owned: oklch(0.55 0.13 160);
    --st-wishlist: oklch(0.58 0.2 355);
    --st-unjudged: oklch(0.5 0.01 275);
    --st-trash: oklch(0.55 0.01 275);
    --st-review: oklch(0.62 0.14 75);
    --st-requested: oklch(0.52 0.15 255);
    --bad: oklch(0.55 0.2 25);
    --sh-card: 0 1px 3px rgb(20 20 40 / 0.12);
    --sh-card-hover: 0 0 0 2px var(--accent), 0 12px 26px rgb(20 20 40 / 0.18);
    --sh-pop: 0 18px 50px rgb(20 20 40 / 0.18), 0 0 0 1px var(--line);
  }
  /* Pills and overlays that sit ON box art keep dark glass + the DARK hues. */
  .on-art {
    --st-owned: oklch(0.8 0.14 160);
    --st-wishlist: oklch(0.74 0.17 355);
    --st-unjudged: oklch(0.76 0.01 275);
    --st-trash: oklch(0.62 0.01 275);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font-ui); }
  a { color: var(--accent-text); text-decoration: none; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .ic { flex: none; display: block; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* header */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--header-bg); backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--text); min-width: 0; }
  .brand img { width: 26px; height: 26px; flex: none; display: block; }
  .brand__word { font-weight: 800; font-size: 16px; letter-spacing: -0.03em; }

  /* controls (cabinet.css) */
  .icon-btn {
    flex: none; width: 34px; height: 34px; padding: 0; border: none; border-radius: var(--r-md);
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); color: var(--text); transition: background var(--dur) var(--ease);
  }
  .icon-btn:hover { background: var(--surface-2); }
  .btn {
    flex: none; white-space: nowrap; height: 34px; padding: 0 11px; border: none;
    display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-md);
    background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500;
    transition: background var(--dur) var(--ease);
  }
  .btn:hover { background: var(--surface-2); text-decoration: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn--primary { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--sh-glow); }
  .btn--primary:hover { background: var(--accent-hover); }
  .btn-sm {
    flex: none; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px;
    border: none; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text);
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .btn-sm:hover { background: var(--surface-3); text-decoration: none; }
  .field {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px;
    border-radius: var(--r-md); background: var(--surface); color: var(--text-3);
  }
  .field:focus-within { box-shadow: 0 0 0 2px var(--accent-soft), inset 0 0 0 1px var(--accent); }
  .field input {
    flex: 1; min-width: 0; height: 100%; padding: 0; border: none; outline: none;
    background: transparent; color: var(--text); font: 14px var(--font-ui);
  }
  .field input::placeholder { color: var(--text-3); }
  .field input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .6; }
  .seg {
    display: flex; gap: 2px; padding: 3px; border-radius: var(--r-lg);
    background: var(--surface); overflow-x: auto; scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg__item {
    flex: none; white-space: nowrap; display: flex; align-items: center; gap: 5px;
    height: 30px; padding: 0 12px; border: none; border-radius: 7px;
    background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500;
  }
  .seg__item:hover { background: var(--surface-2); color: var(--text); }
  .seg__item--on, .seg__item--on:hover { background: var(--surface-3); color: var(--text); }
  .empty { color: var(--text-3); padding: 48px 16px; text-align: center; }
</style>
<style>
  :root { --card-min: 168px; --wrap: 1180px; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .top__row { display: flex; align-items: center; gap: 8px; height: 58px; }
  .top__spacer { flex: 1; }
  .top__sub { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; }
  .top__counts { font-size: 11px; color: var(--text-3); margin-left: auto; text-align: right; }

  /* collection head: big platform title + toolbar */
  .colbar-wrap { position: relative; }
  .colbar { padding-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .plattitle {
    align-self: flex-start; display: flex; align-items: center; gap: 8px; max-width: 100%;
    background: none; border: none; padding: 0; color: var(--text);
  }
  .plattitle .title {
    font-size: 32px; line-height: 1; font-weight: 800; letter-spacing: -0.035em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .plattitle .chev {
    flex: none; width: 28px; height: 28px; border-radius: var(--r-md); background: var(--surface);
    color: var(--text-2); display: flex; align-items: center; justify-content: center;
    transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .plattitle:hover .chev { background: var(--surface-2); color: var(--text); }
  .plattitle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .toolbar .field { flex: 1 1 auto; min-width: 0; }
  .toolbar .filters { flex: none; }
  .filters { display: flex; gap: 4px; padding: 3px; border-radius: var(--r-lg); background: var(--surface); }
  .fchip {
    position: relative; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
    border-radius: 7px; color: var(--text-3); font-size: 13px; font-weight: 500; cursor: pointer;
    user-select: none; transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .fchip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .fchip:hover { background: var(--surface-2); color: var(--text-2); }
  .fchip:has(input:checked) { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .fchip .ic { color: var(--text-3); }
  .fchip--owned:has(input:checked) .ic { color: var(--st-owned); }
  .fchip--wishlist:has(input:checked) .ic { color: var(--st-wishlist); }
  .fchip--trash:has(input:checked) .ic { color: var(--st-trash); }
  .fchip:has(input:focus-visible) { box-shadow: var(--focus-ring); }
  .fchip:has(input:checked:focus-visible) { box-shadow: inset 0 0 0 1.5px var(--accent), var(--focus-ring); }

  /* platform picker (sidebar platform list, as a popover) */
  .picker {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 30; margin-top: 8px;
    pointer-events: none;
  }
  .picker .inner {
    pointer-events: auto; max-width: 420px; max-height: min(70vh, 640px); overflow: auto;
    margin-left: max(24px, calc((100vw - var(--wrap)) / 2 + 24px)); margin-right: 16px;
    background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--sh-pop);
    padding: 6px; display: flex; flex-direction: column; gap: 1px;
  }
  .plist__head {
    padding: 12px 8px 4px; color: var(--text-3); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .plat {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 5px 8px;
    border: none; border-radius: var(--r-md); background: none; color: var(--text);
    font-size: 13px; text-align: left;
  }
  .plat:hover { background: var(--surface-2); }
  .plat--on, .plat--on:hover { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .plat__tile {
    flex: none; width: 26px; height: 26px; border-radius: var(--r-sm); background: var(--surface-2);
    color: var(--text-2); display: flex; align-items: center; justify-content: center;
    font: 600 7px var(--font-mono); letter-spacing: -0.02em;
  }
  .plat--on .plat__tile { color: var(--accent-text); background: var(--accent-soft); }
  .plat__name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plat__count { flex: none; font-size: 11px; color: var(--text-3); }
  .plat--on .plat__count { color: var(--accent-text); }

  /* snapshot (LibrarySnapshot) */
  #stats { margin-top: 16px; }
  .snap {
    border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .snap__row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .snap__kpis { display: flex; gap: 22px; flex-wrap: wrap; }
  .snap__kpi { display: flex; align-items: center; gap: 7px; }
  .snap__kpi b { font: 600 18px var(--font-mono); letter-spacing: -0.02em; }
  .snap__kpi-label { font-size: 12px; color: var(--text-3); }
  .snap__bar { flex: 1; min-width: 120px; display: flex; height: 8px; gap: 2px; border-radius: 4px; overflow: hidden; }
  .snap__bar i { display: block; height: 100%; }
  .snap__more {
    align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 4px;
    margin: -4px 0 -4px -4px; border: none; border-radius: var(--r-sm); background: none;
    color: var(--text-2); font-size: 12px; font-weight: 500;
  }
  .snap__more:hover { background: var(--surface-2); color: var(--text); }
  .snap__more .ic { transition: transform var(--dur) var(--ease); }
  .snap--open .snap__more .ic { transform: rotate(90deg); }
  .snap__consoles {
    display: none; grid-template-columns: 1fr 1fr; gap: 6px 28px;
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .snap--open .snap__consoles { display: grid; }
  .snap__console { display: grid; grid-template-columns: 120px 1fr 64px; align-items: center; gap: 10px; font-size: 12px; }
  .snap__console-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snap__console-bar { height: 6px; border-radius: 3px; background: var(--surface-2); display: flex; overflow: hidden; }
  .snap__console-bar i { display: block; height: 100%; }
  .snap__console-n { font-size: 11px; color: var(--text-2); text-align: right; white-space: nowrap; }
  .snap__foot { grid-column: 1 / -1; font-size: 11px; color: var(--text-3); padding-top: 4px; }

  main { padding-top: 18px; padding-bottom: 48px; }

  /* game grid + merged cards (cabinet.css .gc / .gc--merged) */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
    gap: 14px; align-items: stretch;
  }
  .gc {
    position: relative; min-width: 0; display: flex; flex-direction: column;
    background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-card);
    transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  @media (hover: hover) {
    .gc:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--sh-card-hover); z-index: 2; }
    .gc:hover .gc__acts { opacity: 1; }
  }
  .gc__art {
    position: relative; aspect-ratio: 3 / 4; overflow: hidden;
    border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface-2);
  }
  .gc__art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .gc__art iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 3; }
  .gc__noart {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px 12px 48px; text-align: center; font-size: 12px; color: var(--text-3);
    background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px);
  }
  .gc__hit { position: absolute; inset: 0; z-index: 1; }
  .gc__top {
    position: absolute; left: 6px; right: 6px; top: 6px; z-index: 2; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 4px;
  }
  .gc__top > * { pointer-events: auto; }
  .pill-art {
    flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px; height: 22px;
    padding: 0 8px 0 6px; border-radius: var(--r-pill); background: var(--glass);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #fff; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .pill-art .ic { width: 12px; height: 12px; }
  .pill-art--owned .ic { color: var(--st-owned); }
  .pill-art--wishlist .ic { color: var(--st-wishlist); }
  .pill-art--trash .ic { color: var(--st-trash); }
  .gc__acts { display: flex; gap: 4px; flex: none; opacity: .92; transition: opacity var(--dur) var(--ease); }
  .pill-more {
    flex: none; width: 26px; height: 26px; padding: 0; border: none; border-radius: var(--r-pill);
    display: flex; align-items: center; justify-content: center;
    background: rgb(10 10 16 / 0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #fff; font: 700 11px var(--font-ui);
  }
  .pill-more:hover { background: var(--accent); text-decoration: none; }
  .gc__caption {
    position: absolute; inset: auto 0 0 0; z-index: 0; padding: 28px 9px 8px;
    background: linear-gradient(transparent, rgb(8 8 14 / 0.92));
    display: flex; flex-direction: column; gap: 3px;
  }
  .gc__title {
    font-size: 13px; font-weight: 600; color: #fff; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .gc__meta { font: 500 10px var(--font-mono); color: rgb(255 255 255 / 0.65); white-space: nowrap; overflow: hidden; }
  .mgc__rows { flex: 1; padding: 5px; display: flex; flex-direction: column; gap: 2px; }
  .mgc__row { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 3px 0 7px; border-radius: 7px; }
  .mgc__row-label { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rstat {
    flex: none; width: 26px; height: 22px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .rstat .ic { width: 12px; height: 12px; }
  .rstat--owned { color: var(--st-owned); background: color-mix(in oklch, var(--st-owned) 16%, transparent); }
  .rstat--wishlist { color: var(--st-wishlist); background: color-mix(in oklch, var(--st-wishlist) 16%, transparent); }
  .rstat--trash { color: var(--st-trash); background: var(--surface-2); }
  .mgc__row--extra { display: none; }
  .gc--open .mgc__row--extra { display: flex; }
  .mgc__more {
    align-self: flex-start; height: 24px; margin: 2px 0 0 4px; padding: 0 8px; border: none;
    border-radius: var(--r-sm); background: transparent; color: var(--accent-text); font-size: 11px; font-weight: 600;
  }
  .mgc__more:hover { background: var(--accent-soft); }
  .mgc__req {
    display: flex; align-items: center; gap: 6px; padding: 6px 6px 3px; margin-top: 2px;
    border-top: 1px solid var(--line);
  }
  .mgc__rows--trash .mgc__req { border-top: 0; margin-top: auto; }
  .mgc__votes { flex: 1; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--st-requested); }
  .mgc__votes--zero { color: var(--text-3); font-weight: 500; }
  .votebtn { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .votebtn:hover { background: var(--accent); color: var(--on-accent); }
  .votebtn.voted, .votebtn.voted:hover {
    background: color-mix(in oklch, var(--st-owned) 16%, transparent); color: var(--st-owned); cursor: default;
  }
  .gc--trash .gc__art > img { filter: saturate(.55) brightness(.85); }

  /* activity feed */
  .day { margin-top: 30px; }
  .day:first-child { margin-top: 6px; }
  .day__h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .day__tally { display: inline-flex; align-items: center; gap: 10px; font: 500 11px var(--font-mono); color: var(--text-3); letter-spacing: 0; }
  .day__tally span { display: inline-flex; align-items: center; gap: 4px; }
  .day__tally .t-w .ic { color: var(--st-wishlist); }
  .day__tally .t-t .ic { color: var(--st-trash); }
  .acc { margin-top: 12px; border-radius: 12px; background: var(--bg-sunk); border: 1px solid var(--line); }
  .acc > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 12px; border-radius: 12px; color: var(--text-2); font-size: 13px; font-weight: 500;
  }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary:hover { color: var(--text); background: var(--surface); }
  .acc > summary .n { font: 500 11px var(--font-mono); color: var(--text-3); background: var(--surface-2); padding: 1px 7px; border-radius: var(--r-pill); }
  .acc > summary .chev { margin-left: auto; color: var(--text-3); transition: transform var(--dur) var(--ease); }
  .acc[open] > summary .chev { transform: rotate(90deg); }
  .acc__body { padding: 4px 12px 14px; }
  .acc--earlier { margin-top: 30px; background: none; border-width: 1px 0 0; border-radius: 0; }
  .acc--earlier > summary { padding: 0; height: 52px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); border-radius: 0; }
  .acc--earlier > summary:hover { background: none; }
  .acc--earlier > .acc__body { padding: 0; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 36px 0 8px; font-size: 12px; color: var(--text-3); }

  /* phones */
  @media (max-width: 720px) {
    :root { --card-min: 140px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
    .top__row { height: 52px; }
    .top__sub { flex-wrap: wrap; gap: 6px 12px; }
    .top__sub .seg { flex: 1 1 100%; }
    .top__sub .seg__item { flex: 1 1 0; justify-content: center; }
    .top__counts { margin-left: 0; text-align: left; }
    .colbar { padding-top: 16px; gap: 12px; }
    .plattitle .title { font-size: 26px; }
    .toolbar { flex-wrap: wrap; }
    .toolbar .field { flex-basis: 100%; }
    .toolbar .filters { flex: 1 1 100%; }
    .fchip { flex: 1 1 0; justify-content: center; padding: 0 6px; }
    .picker .inner { margin-left: 16px; max-width: none; }
    .snap__consoles { grid-template-columns: 1fr; }
    .snap__console { grid-template-columns: 96px 1fr 52px; }
    .grid { gap: 10px; }
    .gc__acts { opacity: 1; }
    .btn--label-hide span { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top__row">
    <a class="brand" href="index.html"><img src="favicon.png" alt="" width="26" height="26"><span class="brand__word">Frankenstein</span></a>
    <span class="top__spacer"></span>
    <a class="btn btn--label-hide" href="classifica.html" id="rankLink" title="Save-from-the-trash leaderboard"></a>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light / dark theme"></button>
  </div>
  <div class="wrap top__sub">
    <div class="seg" id="view">
      <button class="seg__item seg__item--on" data-v="activity">Activity</button>
      <button class="seg__item" data-v="collection">Collection</button>
    </div>
    <div class="top__counts num" id="counts"></div>
  </div>
</header>
<div class="colbar-wrap">
  <div id="colbar" class="wrap colbar" style="display:none">
    <button class="plattitle" id="platBtn" aria-expanded="false" aria-haspopup="listbox">
      <span class="title" id="platTitle">All Platforms</span>
      <span class="chev" id="platChev"></span>
    </button>
    <div class="toolbar">
      <label class="field" id="qField">
        <input id="q" type="search" placeholder="Search every Frankie game…" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="filters" role="group" aria-label="Status">
        <label class="fchip fchip--owned"><input type="checkbox" id="fOwned" checked><span data-ic="star"></span>Owned</label>
        <label class="fchip fchip--wishlist"><input type="checkbox" id="fWish" checked><span data-ic="heart"></span>Wishlist</label>
        <label class="fchip fchip--trash"><input type="checkbox" id="fTrash"><span data-ic="x"></span>Trashed</label>
      </div>
    </div>
  </div>
  <div class="picker" id="picker" style="display:none"><div class="inner" id="pickerInner" role="listbox"></div></div>
</div>
<section id="stats" class="wrap" style="display:none"></section>
<main class="wrap"><div id="feed"></div></main>
<script src="data.js?v=5ef2c6eadf4e"></script>
<script>
  var GAMES = window.GAMES || [], PLATFORMS = window.PLATFORMS || [];
  var STATS = window.STATS || { owned: 0, wishlist: 0, unjudged: 0, trash: 0, byConsole: [] };
  var LAST_PULL = "Updated 9 Oct 2026, 08:55";
  // "Save it from the Trash" upvote: a fetch straight to a Google Form's
  // response endpoint, no page navigation, no account needed. The site stays
  // static — this is just a client posting to Google's infra, same as the
  // form itself would. Tallied into classifica.html on the next daily publish.
  var VOTE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfck4TIVc3NTWdDp7M-Zt5P3My4eS5JJgov58ftG_aB87KC4Q/formResponse", VOTE_ENTRY_ID = "entry.1802538607";
  function voteTrash(btn, key) {
    try { if (localStorage.getItem('votedTrash_' + key) === '1') return; } catch (e) {}
    try {
      var body = VOTE_ENTRY_ID + '=' + encodeURIComponent(key);
      fetch(VOTE_FORM_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      }).catch(function () {});
    } catch (e) {}
    try { localStorage.setItem('votedTrash_' + key, '1'); } catch (e) {}
    if (btn) {
      btn.disabled = true;
      btn.classList.add('voted');
      btn.innerHTML = icon('check', 12) + 'Saved';
    }
  }
  // Trash is huge (100k+) — its own file, fetched only on the first search or
  // when the day-feed needs its per-day "trashed" accordions.
  var TRASH = [], trashState = 'none';  // none | loading | ready
  function loadTrash() {
    if (trashState === 'loading' || trashState === 'ready') return;
    trashState = 'loading';
    var sc = document.createElement('script');
    sc.src = 'trash.js?v=9d046a228d7c';
    sc.onload = function () {
      TRASH = window.TRASH || [];
      // trash rows carry the merge key as `ig_id` to keep bytes down elsewhere.
      TRASH.forEach(function (t) { if (t.ig_id != null && t.igdb_id == null) t.igdb_id = t.ig_id; });
      trashState = 'ready';
      render();
    };
    sc.onerror = function () { trashState = 'none'; };
    document.head.appendChild(sc);
    render();  // show a "loading…" state immediately
  }
  var labelBySlug = {};
  PLATFORMS.forEach(function (p) { labelBySlug[p.slug] = p.label; });
  (STATS.byConsole || []).forEach(function (c) { if (!labelBySlug[c.slug]) labelBySlug[c.slug] = c.label; });

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  document.getElementById('counts').textContent = LAST_PULL;

  var state = { view: 'activity', page: 0, q: '', platform: '', owned: true, wishlist: true, trash: false };
  var MAX = 600;
  var IGDB_IMG = 'https://images.igdb.com/igdb/image/upload/';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  window.thumbFail = function (img) {
    var d = document.createElement('span');
    d.className = 'gc__noart';
    d.textContent = img.getAttribute('data-name') || '?';
    img.replaceWith(d);
  };
  function coverUrl(g) { return g.cover || (g.ig ? IGDB_IMG + g.ig + '.jpg' : null); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function ytId(v) { return String(v || '').replace(/[^A-Za-z0-9_-]/g, ''); }

  // ---- trailer (lazy YouTube iframe, one playing at a time) --------------
  var ytApiPromise = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (ytApiPromise) return ytApiPromise;
    ytApiPromise = new Promise(function (res) {
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prev) prev(); res(window.YT); };
      var sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(sc);
    });
    return ytApiPromise;
  }
  var activePlayer = null, activePlayerMount = null;
  function destroyActivePlayer() {
    if (activePlayer) { try { activePlayer.destroy(); } catch (e) {} }
    activePlayer = null; activePlayerMount = null;
  }
  window.playCardTrailer = function (btn, vid) {
    destroyActivePlayer();
    var wrap = btn.closest('.coverwrap');
    if (!wrap) return;
    var mount = document.createElement('div');
    wrap.innerHTML = '';
    wrap.appendChild(mount);
    activePlayerMount = mount;
    loadYT().then(function (YT) {
      if (activePlayerMount !== mount) return;
      activePlayer = new YT.Player(mount, {
        videoId: vid,
        playerVars: { autoplay: 1, controls: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: { onReady: function (e) { try { e.target.playVideo(); } catch (x) {} } }
      });
    });
  };

  // Search relevance: exact name (0) < starts-with (1) < a word starts with it
  // (2) < appears anywhere (3); -1 = no match. Lower sorts first.
  function scoreName(name, q) {
    var n = (name || '').toLowerCase();
    if (n === q) return 0;
    if (n.lastIndexOf(q, 0) === 0) return 1;
    var words = n.split(/[^a-z0-9]+/);
    for (var i = 0; i < words.length; i++) if (words[i].lastIndexOf(q, 0) === 0) return 2;
    return n.indexOf(q) !== -1 ? 3 : -1;
  }
  function bySearch(list, q) {
    return list
      .map(function (g) { return { g: g, s: scoreName(g.name, q) }; })
      .filter(function (x) { return x.s !== -1; })
      .sort(function (a, b) {
        return a.s - b.s || (a.g.name || '').localeCompare(b.g.name || '');
      })
      .map(function (x) { return x.g; });
  }

  // ---- cross-platform merge (mirrors the desktop wishlist view) ----------
  // One card per game (keyed by igdb_id); each console it's on = one row with an
  // owned / wishlist / trash pill. Read-only — no status controls.
  function groupByGame(list) {
    var map = {}, order = [];
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      var key = g.igdb_id != null ? 'i' + g.igdb_id : 'm' + g.id;
      var grp = map[key];
      if (!grp) { grp = { rep: g, bySlug: {}, rows: [], d: null, ts: null, key: key }; map[key] = grp; order.push(key); }
      if (g.d && (!grp.d || g.d > grp.d)) grp.d = g.d;
      if (g.ts && (!grp.ts || g.ts > grp.ts)) grp.ts = g.ts;
      // prefer a rep that actually has a trailer / igdb slug for the card buttons
      if (!grp.rep.vid && g.vid) grp.rep.vid = g.vid;
      if (!grp.rep.sl && g.sl) grp.rep.sl = g.sl;
      if (!grp.bySlug[g.platform]) {
        var row = { slug: g.platform, label: labelBySlug[g.platform] || g.platform, status: g.status || 'trash' };
        grp.bySlug[g.platform] = row;
        grp.rows.push(row);
      }
    }
    return order.map(function (k) {
      var grp = map[k];
      grp.rows.sort(function (a, b) { return a.label.localeCompare(b.label); });
      // Overall status: owned if owned anywhere, else wishlist if kept anywhere,
      // else trash — ONLY when every platform it exists on is trashed. Computed
      // here (not per-view) so the owned/wishlist/trash checkboxes always filter
      // on a game's true merged status, never on one row seen in isolation (a
      // title wishlisted on NES but trashed on DOS must never pass the Trash
      // filter just because its DOS row got filtered into view alone).
      grp.overall = grp.rows.some(function (r) { return r.status === 'owned'; })
        ? 'owned'
        : (grp.rows.some(function (r) { return r.status === 'wishlist'; }) ? 'wishlist' : 'trash');
      return grp;
    });
  }

  // One merged card, same anatomy as the desktop MergedGameCard: cover with a
  // glass status pill + caption, then one row per console with a read-only
  // status badge (no judge controls here). Cover click = IGDB.
  var MAX_ROWS = 3;
  function mergedCard(grp) {
    var g = grp.rep;
    var overall = grp.overall;
    var st = STATUS[overall] || STATUS.trash;
    var cov = coverUrl(g);
    var inner = cov
      ? '<img loading="lazy" alt="" data-name="' + esc(g.name || '?') +
        '" src="' + esc(cov) + '" onerror="thumbFail(this)">'
      : '<span class="gc__noart">' + esc(g.name || '?') + '</span>';
    var igdbUrl = g.sl
      ? 'https://www.igdb.com/games/' + encodeURIComponent(g.sl)
      : 'https://www.igdb.com/search?type=1&q=' + encodeURIComponent(g.name || '');
    var gUrl = 'https://www.google.com/search?q=' +
      encodeURIComponent((g.name || '') + ' ' + (labelBySlug[g.platform] || g.platform || '') + ' game');
    var vid = ytId(g.vid);
    var acts = '<span class="gc__acts">' +
      (vid ? '<button class="pill-more" title="Play trailer" aria-label="Play trailer" onclick="playCardTrailer(this,&#39;' +
        vid + '&#39;)">' + icon('play', 11) + '</button>' : '') +
      '<a class="pill-more" href="' + esc(gUrl) + '" target="_blank" rel="noopener noreferrer" title="Search on Google" aria-label="Search on Google">G</a>' +
      '</span>';

    // Meta line: year · N consoles (only counting the consoles shown as rows).
    var keep = grp.rows.filter(function (r) { return r.status === 'owned' || r.status === 'wishlist'; });
    var rowsList = state.platform ? grp.rows.slice(0, 1) : keep;
    var meta = [g.year ? String(g.year) : '—',
      rowsList.length > 1 ? rowsList.length + ' consoles' : (rowsList[0] ? rowsList[0].label : '')]
      .filter(Boolean).join(' · ');

    var art = '<div class="gc__art coverwrap on-art">' + inner +
      '<a class="gc__hit" href="' + esc(igdbUrl) + '" target="_blank" rel="noopener noreferrer" title="Open on IGDB" aria-label="' +
        esc(g.name || '') + ' on IGDB"></a>' +
      '<div class="gc__top"><span class="pill-art pill-art--' + overall + '">' + icon(st.icon, 12) +
        '<span>' + st.label + '</span></span>' + acts + '</div>' +
      '<div class="gc__caption"><div class="gc__title">' + esc(g.name) + '</div>' +
        '<div class="gc__meta">' + esc(meta) + '</div></div>' +
      '</div>';

    var rows = rowsList.map(function (r, i) {
      var rs = STATUS[r.status] || STATUS.trash;
      return '<div class="mgc__row' + (i >= MAX_ROWS ? ' mgc__row--extra' : '') + '">' +
        '<span class="mgc__row-label" title="' + esc(r.label) + '">' + esc(r.label) + '</span>' +
        '<span class="rstat rstat--' + r.status + '" title="' + rs.label + ' on ' + esc(r.label) + '">' +
        icon(rs.icon, 12) + '</span></div>';
    }).join('');
    if (rowsList.length > MAX_ROWS) {
      var extra = rowsList.length - MAX_ROWS;
      rows += '<button class="mgc__more" onclick="toggleRows(this,' + extra + ')">+' + extra +
        ' more console' + (extra === 1 ? '' : 's') + '</button>';
    }

    var vote = '';
    if (overall === 'trash') {
      var voted = false;
      try { voted = localStorage.getItem('votedTrash_' + grp.key) === '1'; } catch (e) {}
      var vn = g.v || 0;
      vote = '<div class="mgc__req"><span class="mgc__votes num' + (vn ? '' : ' mgc__votes--zero') +
        '" title="Votes to save it from the trash">' + icon('thumb', 12) + fmt(vn) + ' ' + (vn === 1 ? 'vote' : 'votes') +
        '</span><button class="btn-sm votebtn' + (voted ? ' voted' : '') + '" onclick="voteTrash(this,&#39;' +
        esc(grp.key) + '&#39;)"' + (voted ? ' disabled' : '') + ' title="Vote to save it from the trash">' +
        (voted ? icon('check', 12) + 'Saved' : 'Save it') + '</button></div>';
    }
    var trashOnly = overall === 'trash' && !state.platform;
    return '<div class="gc' + (overall === 'trash' ? ' gc--trash' : '') + '">' + art +
      '<div class="mgc__rows' + (trashOnly ? ' mgc__rows--trash' : '') + '">' + (trashOnly ? '' : rows) + vote + '</div></div>';
  }
  window.toggleRows = function (btn, extra) {
    var card = btn.closest('.gc');
    var open = card.classList.toggle('gc--open');
    btn.textContent = open ? 'Show less' : '+' + extra + ' more console' + (extra === 1 ? '' : 's');
  };

  function byPlatform(list) {
    return state.platform ? list.filter(function (g) { return g.platform === state.platform; }) : list;
  }
  function statusSet() {
    var s = {};
    if (state.owned) s.owned = 1;
    if (state.wishlist) s.wishlist = 1;
    if (state.trash) s.trash = 1;
    return s;
  }
  function gridHtml(groups) {
    if (!groups.length) return '<div class="empty">Nothing here.</div>';
    var capped = groups.length > MAX;
    return '<div class="grid">' + groups.slice(0, MAX).map(mergedCard).join('') + '</div>' +
      (capped ? '<div class="empty">Showing first ' + MAX + ' — narrow it with search or a console.</div>' : '');
  }

  // ---- Collection grid: infinite scroll (no 600 cap) -------------------
  var PAGE = 150, collGroups = [], collShown = 0;
  function showCollection(groups) {
    collGroups = groups; collShown = 0;
    var feed = document.getElementById('feed');
    if (!groups.length) { feed.innerHTML = '<div class="empty">No games match.</div>'; return; }
    feed.innerHTML = '<div class="grid" id="collGrid"></div><div id="collMore"></div>';
    appendCollPage();
  }
  function appendCollPage() {
    var grid = document.getElementById('collGrid');
    if (!grid || collShown >= collGroups.length) return;
    var next = collGroups.slice(collShown, collShown + PAGE);
    grid.insertAdjacentHTML('beforeend', next.map(mergedCard).join(''));
    collShown += next.length;
    var more = document.getElementById('collMore');
    if (more) more.innerHTML = collShown < collGroups.length
      ? '<div class="empty">' + fmt(collGroups.length - collShown) + ' more — keep scrolling</div>'
      : '';
  }
  window.addEventListener('scroll', function () {
    if (collShown >= collGroups.length) return;
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 900) appendCollPage();
  }, { passive: true });
  function fmtDay(day) {
    var dt = new Date(day + 'T00:00');
    if (isNaN(dt)) return day;
    var cap1 = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
    var wd = dt.toLocaleDateString('it-IT', { weekday: 'long' });
    var rest = dt.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' })
      .replace(/\p{L}+/u, function (m) { return cap1(m); });  // "31 agosto 2026" -> "31 Agosto 2026"
    return cap1(wd) + ', ' + rest;
  }

  // ---- stats panel (mirrors the desktop "All consoles" LibrarySnapshot) --
  function renderStats() {
    var el = document.getElementById('stats');
    var bc = STATS.byConsole || [];
    var o, w, t;
    if (state.platform) {
      var c = bc.filter(function (x) { return x.slug === state.platform; })[0] || { owned: 0, wishlist: 0, trash: 0 };
      o = c.owned; w = c.wishlist; t = c.trash;
    } else {
      o = STATS.owned || 0; w = STATS.wishlist || 0; t = STATS.trash || 0;
    }
    var grand = (o + w + t) || 1;
    function kpi(key, val) {
      var m = STATUS[key];
      return '<span class="snap__kpi">' + icon(m.icon, 14).replace('class="ic"', 'class="ic" style="color:var(--st-' + key + ')"') +
        '<b>' + fmt(val) + '</b><span class="snap__kpi-label">' + m.label + '</span></span>';
    }
    function seg(key, val) {
      return val ? '<i style="background:var(--st-' + key + ');width:' + (val / grand * 100).toFixed(2) + '%"></i>' : '';
    }
    var open = false;
    try { open = localStorage.getItem('pub:stats-open') === '1'; } catch (e) {}
    var kept = bc.filter(function (x) { return (x.owned + x.wishlist) > 0; });
    var maxKept = kept.reduce(function (m, x) { return Math.max(m, x.owned + x.wishlist); }, 1);
    var SHOWN = 12;
    var rows = kept.slice(0, SHOWN).map(function (x) {
      var op = (x.owned / maxKept * 100).toFixed(1), wp = (x.wishlist / maxKept * 100).toFixed(1);
      return '<div class="snap__console"><span class="snap__console-name" title="' + esc(x.label) + '">' + esc(x.label) +
        '</span><span class="snap__console-bar">' +
        (x.owned ? '<i style="background:var(--st-owned);width:' + op + '%"></i>' : '') +
        (x.wishlist ? '<i style="background:var(--st-wishlist);width:' + wp + '%"></i>' : '') +
        '</span><span class="snap__console-n num">' + fmt(x.owned) + ' · ' + fmt(x.wishlist) + '</span></div>';
    }).join('');
    var more = kept.length > SHOWN ? '<div class="snap__foot">+' + (kept.length - SHOWN) + ' more consoles</div>' : '';
    var perConsole = kept.length && !state.platform;
    el.innerHTML = '<div class="snap' + (open && perConsole ? ' snap--open' : '') + '">' +
      '<div class="snap__row"><div class="snap__kpis">' + kpi('owned', o) + kpi('wishlist', w) + kpi('trash', t) +
      '</div><div class="snap__bar">' + seg('owned', o) + seg('wishlist', w) + seg('trash', t) + '</div></div>' +
      (perConsole
        ? '<button class="snap__more" id="snapMore" aria-expanded="' + open + '">' + icon('right', 14) +
          'Per console <span class="num" style="color:var(--text-3)">' + kept.length + '</span></button>' +
          '<div class="snap__consoles">' + rows + more + '</div>'
        : '') +
      '</div>';
    var b = document.getElementById('snapMore');
    if (b) b.addEventListener('click', function () {
      var snap = el.querySelector('.snap');
      var isOpen = snap.classList.toggle('snap--open');
      b.setAttribute('aria-expanded', isOpen);
      try { localStorage.setItem('pub:stats-open', isOpen ? '1' : '0'); } catch (e) {}
    });
  }

  function render() {
    var activity = state.view === 'activity';
    var searching = !activity && state.q.trim().length >= 1;
    document.getElementById('colbar').style.display = activity ? 'none' : '';
    // stats hide while searching the collection — the results take the space
    document.getElementById('stats').style.display = (activity || searching) ? 'none' : '';
    [].forEach.call(document.getElementById('view').children, function (b) {
      b.classList.toggle('seg__item--on', b.dataset.v === state.view);
    });
    if (activity) renderActivity();
    else renderCollection();
  }

  // ---- COLLECTION: search + stats + owned/wishlist/trashed + platform ----
  function renderCollection() {
    var feed = document.getElementById('feed');
    var q = state.q.trim().toLowerCase();
    if (!q) renderStats();
    var set = statusSet();  // at least one checkbox is always on

    // "Trashed" pulls in the big trash.js on demand
    if (state.trash && trashState !== 'ready') {
      if (trashState === 'none') loadTrash();
      collGroups = [];
      feed.innerHTML = '<div class="empty">Loading trashed games…</div>';
      return;
    }
    if (q.length === 1) {
      collGroups = [];
      feed.innerHTML = '<div class="empty">Keep typing…</div>';
      return;
    }

    // Full context (every row for a game, kept AND trash) goes into grouping —
    // status filtering happens AFTER, on the merged grp.overall, never on a raw
    // row in isolation. Filtering rows first would strip out e.g. the NES
    // wishlist row of a game only checked "Trashed", leaving just its DOS trash
    // row to group alone — making a kept-elsewhere game wrongly pass the filter.
    var src = byPlatform(state.trash ? GAMES.concat(TRASH) : GAMES);
    var groups = (q.length >= 2 ? groupByGame(bySearch(src, q)) : groupByGame(src))
      .filter(function (grp) { return set[grp.overall]; });
    if (q.length < 2) {
      groups.sort(function (a, b) { return (a.rep.name || '').localeCompare(b.rep.name || ''); });
    }
    showCollection(groups);
  }

  // ---- ACTIVITY: the per-day feed --------------------------------------
  function renderActivity() {
    collGroups = [];  // stop the collection infinite-scroll from firing here
    var feed = document.getElementById('feed');
    if (trashState !== 'ready') {
      if (trashState === 'none') loadTrash();
      feed.innerHTML = '<div class="empty">Loading feed…</div>';
      return;
    }
    var ownedG = groupByGame(GAMES);
    // A game kept (owned/wishlisted) on ANY platform shouldn't also appear in the
    // day-feed's "Trashed" accordion — on at least one platform it survived.
    var keptKey = {};
    GAMES.forEach(function (g) {
      keptKey[g.igdb_id != null ? 'i' + g.igdb_id : 'm' + g.id] = true;
    });
    var trashG = groupByGame(TRASH.filter(function (g) { return g.d; }))
      .filter(function (grp) {
        var g = grp.rep;
        return !keptKey[g.igdb_id != null ? 'i' + g.igdb_id : 'm' + g.id];
      });
    var buckets = {}, earlier = { cards: [], trash: [] };
    ownedG.forEach(function (grp) {
      if (grp.d) (buckets[grp.d] = buckets[grp.d] || { cards: [], trash: [] }).cards.push(grp);
      else earlier.cards.push(grp);
    });
    trashG.forEach(function (grp) {
      if (grp.d) (buckets[grp.d] = buckets[grp.d] || { cards: [], trash: [] }).trash.push(grp);
      else earlier.trash.push(grp);
    });
    // Within a day, newest status change first (falls back to name for ties /
    // pre-timestamp rows).
    var byRecent = function (a, b) {
      if (a.ts && b.ts && a.ts !== b.ts) return a.ts < b.ts ? 1 : -1;
      if (a.ts && !b.ts) return -1;
      if (!a.ts && b.ts) return 1;
      return (a.rep.name || '').localeCompare(b.rep.name || '');
    };
    Object.keys(buckets).forEach(function (day) {
      buckets[day].cards.sort(byRecent);
      buckets[day].trash.sort(byRecent);
    });
    var days = Object.keys(buckets).sort().reverse();
    if (!days.length && !earlier.cards.length) {
      feed.innerHTML = '<div class="empty">Nothing yet.</div>';
      return;
    }
    // Paginate: DAYS_PER_PAGE days per page, newest page first; "Earlier"
    // (undated rows) rides on the last page.
    var pages = Math.max(1, Math.ceil(days.length / DAYS_PER_PAGE));
    if (state.page >= pages) state.page = pages - 1;
    var last = state.page === pages - 1;
    var pageDays = days.slice(state.page * DAYS_PER_PAGE, (state.page + 1) * DAYS_PER_PAGE);
    var out = '';
    pageDays.forEach(function (day) {
      var b = buckets[day];
      // wishlist count for the day = merged cards with at least one wishlist row
      var wl = b.cards.filter(function (grp) {
        return (grp.rows || []).some(function (r) { return r.status === 'wishlist'; });
      }).length;
      var tr = b.trash.length;
      var tally = (wl || tr)
        ? '<span class="day__tally"><span class="t-w" title="Wishlisted">' + icon('heart', 11) + fmt(wl) +
          '</span><span class="t-t" title="Trashed">' + icon('x', 11) + fmt(tr) + '</span></span>'
        : '';
      out += '<section class="day"><h2 class="day__h">' + esc(fmtDay(day)) + tally + '</h2>';
      if (b.cards.length) out += gridHtml(b.cards);
      if (b.trash.length) out += trashAcc(b.trash);
      out += '</section>';
    });
    if (last && (earlier.cards.length || earlier.trash.length)) {
      out += '<details class="acc acc--earlier"><summary>Earlier' + icon('right', 16).replace('class="ic"', 'class="ic chev"') +
        '</summary><div class="acc__body">';
      if (earlier.cards.length) out += gridHtml(earlier.cards);
      if (earlier.trash.length) out += trashAcc(earlier.trash);
      out += '</div></details>';
    }
    if (pages > 1) {
      out += '<nav class="pager">' +
        '<button class="btn" data-p="' + (state.page - 1) + '"' + (state.page === 0 ? ' disabled' : '') + '>' +
          icon('left', 14) + 'Newer</button>' +
        '<span class="num">' + (state.page + 1) + ' / ' + pages + '</span>' +
        '<button class="btn" data-p="' + (state.page + 1) + '"' + (last ? ' disabled' : '') + '>Older' +
          icon('right', 14) + '</button>' +
        '</nav>';
    }
    feed.innerHTML = out;
  }
  var DAYS_PER_PAGE = 5;
  function trashAcc(groups) {
    return '<details class="acc"><summary>' + icon('x', 14) + 'Trashed <span class="n">' + fmt(groups.length) +
      '</span>' + icon('right', 14).replace('class="ic"', 'class="ic chev"') + '</summary><div class="acc__body">' +
      gridHtml(groups) + '</div></details>';
  }
  document.getElementById('feed').addEventListener('click', function (e) {
    var b = e.target.closest('.pager button'); if (!b || b.disabled) return;
    state.page = +b.dataset.p;
    render();
    window.scrollTo(0, 0);
  });

  // ---- platform picker (custom, not a <select>) --------------------------
  function platCounts() {
    var c = {};
    var src = (state.q && trashState === 'ready') ? GAMES.concat(TRASH) : GAMES;
    src.forEach(function (g) { c[g.platform] = (c[g.platform] || 0) + 1; });
    return c;
  }
  function buildPicker() {
    var c = platCounts();
    // Group by manufacturer exactly like the desktop app sidebar: groups A–Z
    // with "Arcade" pinned last, platforms within a group sorted by label.
    var groups = {};
    PLATFORMS.forEach(function (p) {
      if (!c[p.slug]) return;
      var g = p.group || 'Arcade';
      (groups[g] = groups[g] || []).push(p);
    });
    var names = Object.keys(groups).sort(function (a, b) {
      if (a === 'Arcade') return 1;
      if (b === 'Arcade') return -1;
      return a.localeCompare(b);
    });
    var total = Object.keys(c).reduce(function (t, k) { return t + c[k]; }, 0);
    function plat(slug, label, tile, n) {
      return '<button role="option" data-slug="' + esc(slug) + '" class="plat' + (slug === state.platform ? ' plat--on' : '') +
        '" aria-selected="' + (slug === state.platform) + '"><span class="plat__tile">' + tile +
        '</span><span class="plat__name">' + esc(label) + '</span><span class="plat__count num">' + fmt(n) + '</span></button>';
    }
    // Console codes in the tile, like the desktop sidebar (shortCode in status.tsx).
    function code(slug) { return esc(slug.replace(/[^a-z0-9]/gi, '').slice(0, 5).toUpperCase()); }
    var rows = [plat('', 'All Platforms', 'ALL', total)];
    names.forEach(function (mfr) {
      rows.push('<div class="plist__head">' + esc(mfr) + '</div>');
      groups[mfr].sort(function (a, b) { return a.label.localeCompare(b.label); }).forEach(function (p) {
        rows.push(plat(p.slug, p.label, code(p.slug), c[p.slug]));
      });
    });
    document.getElementById('pickerInner').innerHTML = rows.join('');
  }
  function setPlatform(slug) {
    state.platform = slug;
    document.getElementById('platTitle').textContent =
      slug ? (labelBySlug[slug] || slug) : 'All Platforms';
    closePicker(); render();
  }
  function openPicker() {
    buildPicker();
    document.getElementById('picker').style.display = '';
    document.getElementById('platBtn').setAttribute('aria-expanded', 'true');
  }
  function closePicker() {
    document.getElementById('picker').style.display = 'none';
    document.getElementById('platBtn').setAttribute('aria-expanded', 'false');
  }
  document.getElementById('platBtn').addEventListener('click', function () {
    document.getElementById('picker').style.display === 'none' ? openPicker() : closePicker();
  });
  document.getElementById('pickerInner').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setPlatform(b.dataset.slug);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#picker') && !e.target.closest('#platBtn')) closePicker();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePicker(); });

  document.getElementById('view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.v;
    render();
  });
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  // Enter dismisses the mobile keyboard (nothing to submit — filtering is live)
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  });
  // at least one status checkbox must stay checked
  var CHECKS = [['fOwned', 'owned'], ['fWish', 'wishlist'], ['fTrash', 'trash']];
  function anyChecked() {
    return CHECKS.some(function (c) { return document.getElementById(c[0]).checked; });
  }
  CHECKS.forEach(function (c) {
    document.getElementById(c[0]).addEventListener('change', function (e) {
      if (!e.target.checked && !anyChecked()) { e.target.checked = true; return; }
      state[c[1]] = e.target.checked;
      render();
    });
  });

  // Chrome icons + theme toggle (ICONS / icon() / toggleTheme() come from _CABINET_HEAD).
  [].forEach.call(document.querySelectorAll('[data-ic]'), function (el) { el.outerHTML = icon(el.getAttribute('data-ic'), 14); });
  document.getElementById('qField').insertAdjacentHTML('afterbegin', icon('search', 15));
  document.getElementById('platChev').innerHTML = icon('down', 16);
  document.getElementById('rankLink').innerHTML = icon('trophy', 14) + '<span>Rank</span>';
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.innerHTML = themeIcon();
  themeBtn.addEventListener('click', function () { toggleTheme(themeBtn); });

  render();
</script>
</body>
</html>
